{% extends "partials/head.html"%} {% block title %} Signup {% endblock %} {%
block content %}{% if message %}
<div class="message">{{ message }}</div>
{% endif %}

<div class="signup_box">
  <div class="signup_inputs">
    <h1>Sign Up</h1>

    <form
      method="POST"
      action="{{ url_for('views.signup') }}"
      class="signup_form"
    >
      <h3>Username</h3>
      <input type="text" name="username" required />
      <h3>Password</h3>
      <input type="password" name="password" required />
      <h3>Confirm Password</h3>
      <input type="password" name="confirm_password" required />
      <div class="signup_btns">
        <a href="{{ url_for('views.signin') }}" class="login_link"
          >Already have an account? Log in</a
        >
        <div class="signup_main_btns">
          <input type="submit" value="Sign Up" class="submit_btn" />
          <a href="{{ url_for('views.home') }}" class="submit_btn cancel_btn"
            >Cancel</a
          >
        </div>
      </div>
    </form>
  </div>
  <div class="signup_message">
    <h1>Welcome!</h1>
  </div>
</div>
{% endblock %}
