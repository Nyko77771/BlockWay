{% extends "partials/head.html"%} {% block navbar %} {% include
"partials/navbar.html" %} {% endblock %} {% block title %} Signup {% endblock %}
{% block content %}
<div class="signup_box">
  <h2>Sign Up</h2>
</div>
<form method="POST" action="{{ url_for('views.signup') }}" class="signup_form">
  <h3>Username</h3>
  <input type="text" name="username" required />
  <h3>Password</h3>
  <input type="password" name="password" required />
  <h3>Confirm Password</h3>
  <input type="password" name="confirm_password" required />
  <input type="submit" value="Sign Up" class="submit_btn" />
  {% endblock %}
</form>
