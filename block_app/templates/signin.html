{% extends "partials/head.html"%} {% block title %} Signin {% endblock %} {%
block content %}
<div class="signin_box">
  <h2>Login</h2>
  <form method="POST" action="{{ url_for('views.signin') }}">
    <h3>Username</h3>
    <input type="text" name="username" required />
    <h3>Password</h3>
    <input type="password" name="password" required />
    <input type="submit" value="Login" />
  </form>
</div>
{% endblock %}
