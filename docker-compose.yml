services:
  pihole:
    container_name: pihole
    hostname: pihole
    image: pihole/pihole:latest
    environment:
      TZ: "Europe/Dublin"
      FTLCONF_webserver_api_password: "@connection5"
      FTLCONF_dns_listeningMode: "all"
    expose:
      - "80"
    volumes:
      - "/home/nykyta/pihole/etc-pihole:/etc/pihole"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - my_network
  web:
    container_name: web
    build: .
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - my_network

  caddy:
    container_name: caddy
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy_network
      - my_network

networks:
  my_network:
    driver: bridge
  proxy_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
